<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - QuickFixer</title>
      <link rel="icon" type="image/png" href="Quick-fixer-img/main-logo.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"> 
 <link rel="stylesheet" href="Quick-Fixer-Style/Main.css">
</head>
<body>

    <main>
        <section class="login-page py-5 d-flex align-items-center justify-content-center" style="min-height: 85vh; background-color: #f8f9fa;">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-4">

                        <div class="card shadow-lg p-4 login-form-card">
                            <div class="card-body">
                                
                                <h2 class="text-center fw-bold mb-4"><i class="fas fa-user-circle me-2"></i> Customer Login</h2>
                                <p class="text-center text-muted mb-4">Access your past bookings and details.</p>

                                <form action="process_customer_login.php" method="POST">
                                    
                                    <div class="mb-3">
                                        <label for="username" class="form-label">Email / Phone Number</label>
                                        <input type="text" class="form-control" id="username" name="username" required>
                                    </div>
                                    
                                    <div class="mb-4">
                                        <label for="password" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="password" name="password" required>
                                    </div>
                                    
                                    <div class="d-grid mb-3">
                                        <button type="submit" class="btn btn-lg fw-bold login-btn">Login</button>
                                    </div>
                                    
                                    <div class="text-center">
                                        <a href="#" class="small text-muted">Forgot Password?</a>
                                    </div>
                                    
                                </form>
                            </div>
                            
                            <div class="card-footer text-center bg-transparent border-0 mt-3">
                                <p class="mb-2 small">Don't have an account? <a href="#">Sign Up</a></p>
                                <p class="mb-0 small text-muted border-top pt-2">
                                    <i class="fas fa-users-cog me-1"></i> Are you a Technician? <a href="Employ-login.html" style="color: var(--employee-color);">Employee Login</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
