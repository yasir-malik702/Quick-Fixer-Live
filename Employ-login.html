    <main>
        <section class="login-page py-5 d-flex align-items-center justify-content-center" style="min-height: 85vh; background-color: #f8f9fa;">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-4">

                        <div class="card shadow-lg p-4 login-form-card login-employee-color">
                            <div class="card-body">
                                
                                <h2 class="text-center fw-bold mb-4"><i class="fas fa-users-cog me-2"></i> Employee/Technician Login</h2>
                                <p class="text-center text-muted mb-4">Access your job assignments and records.</p>

                                <form action="process_employee_login.php" method="POST">
                                    
                                    <div class="mb-3">
                                        <label for="username" class="form-label">Employee ID / Phone Number</label>
                                        <input type="text" class="form-control" id="username" name="username" required>
                                    </div>
                                    
                                    <div class="mb-4">
                                        <label for="password" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="password" name="password" required>
                                    </div>
                                    
                                    <div class="d-grid mb-3">
                                        <button type="submit" class="btn btn-lg fw-bold login-btn">Login</button>
                                    </div>
                                    
                                    <div class="text-center">
                                        <a href="#" class="small text-muted">Forgot Password?</a>
                                    </div>
                                    
                                </form>
                            </div>
                            
                            <div class="card-footer text-center bg-transparent border-0 mt-3">
                                <p class="mb-0 small text-danger">Internal Use Only</p>
                            </div>
