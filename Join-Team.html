<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Team - QuickFixer Technicians</title>
      <link rel="icon" type="image/png" href="Quick-fixer-img/main-logo.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="Quick-Fixer-Style/Main.css">
    
    <style>
        :root {
            --primary-color: #007b8f; 
            --employee-color: #34495e; 
        }
        
      
    </style>
</head>
<body>
    <main>
        <section class="registration-page py-5 d-flex align-items-center justify-content-center" style="min-height: 85vh; background-color: #f8f9fa;">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-8">

                        <div class="card shadow-lg p-5 registration-form-card">
                            <div class="card-body">
                                
                                <h2 class="text-center fw-bold mb-3"><i class="fas fa-handshake me-2"></i> Join The QuickFixer Team</h2>
                                <p class="text-center text-muted mb-5">Fill out this detailed form to register as a certified technician.</p>

                                <form action="process_technician_registration.php" method="POST" enctype="multipart/form-data">
                                    
                                    <h3 class="fs-5 fw-bold mb-3"><i class="fas fa-user-gear me-2"></i> Personal & Contact Information</h3>
                                    <div class="row g-3 mb-4 border p-3 rounded">
                                        <div class="col-md-6">
                                            <label for="fullName" class="form-label">Full Name</label>
                                            <input type="text" class="form-control" id="fullName" name="fullName" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="cnic" class="form-label">CNIC Number</label>
                                            <input type="text" class="form-control" id="cnic" name="cnic" placeholder="e.g., 33100-XXXXXXX-X" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="phone" class="form-label">Phone Number</label>
                                            <input type="tel" class="form-control" id="phone" name="phone" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="email" class="form-label">Email Address (Optional)</label>
                                            <input type="email" class="form-control" id="email" name="email">
                                        </div>
                                        <div class="col-12">
                                            <label for="address" class="form-label">Full Residential Address</label>
                                            <input type="text" class="form-control" id="address" name="address" required>
                                        </div>
                                    </div>

                                    <h3 class="fs-5 fw-bold mb-3 mt-4"><i class="fas fa-tools me-2"></i> Expertise & Experience</h3>
                                    <div class="row g-3 mb-4 border p-3 rounded">
                                        <div class="col-md-6">
                                            <label for="specialization" class="form-label">Primary Specialization</label>
                                            <select class="form-select" id="specialization" name="specialization" required>
                                                <option selected disabled>Choose Service...</option>
                                                <option>Electrician</option>
                                                <option>Plumber</option>
                                                <option>AC Technician</option>
                                                <option>General Handyman</option>
                                                <option>Home Painter</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="experience" class="form-label">Years of Experience</label>
                                            <input type="number" class="form-control" id="experience" name="experience" min="1" required>
                                        </div>
                                        <div class="col-12">
                                            <label for="about" class="form-label">Tell us about your skills and previous experience:</label>
                                            <textarea class="form-control" id="about" name="about" rows="3" required></textarea>
                                        </div>
                                    </div>

                                    <h3 class="fs-5 fw-bold mb-3 mt-4"><i class="fas fa-file-alt me-2"></i> Documents (For Verification)</h3>
                                    <div class="row g-3 mb-4 border p-3 rounded">
                                        <div class="col-md-6">
                                            <label for="cnicFront" class="form-label">CNIC Front Image</label>
                                            <input type="file" class="form-control" id="cnicFront" name="cnicFront">
                                            <small class="text-muted">Max file size 2MB (JPG/PNG)</small>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="policeVerification" class="form-label">Your Last Education Certificate </label>
                                            <input type="file" class="form-control" id="policeVerification" name="policeVerification">
                                        </div>
                                    </div>
                                    
                                    <div class="d-grid mt-4">
                                        <button type="submit" class="btn btn-lg fw-bold register-btn">Submit Application</button>
                                    </div>

                                </form>
                            </div>
                            
                            <div class="card-footer text-center bg-transparent border-0 mt-3">
                                <p class="mb-0 small">Already registered? <a href="Employ-login.html" style="color: var(--employee-color);">Employee Login</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    </body>
</html>
